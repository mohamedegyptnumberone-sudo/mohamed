<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<title>Private Voice Room</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 20% 20%, #1e293b, #0f172a 70%);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    overflow-x: hidden;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: rgba(30, 41, 59, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 1.75rem;
    padding: 1.75rem 1.5rem;
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    text-align: center;
  }
  h1 {
    font-size: 1.35rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { font-size: 0.78rem; color: #94a3b8; margin-bottom: 1rem; }
  .lock-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.68rem;
    color: #94a3b8;
    background: rgba(148, 163, 184, 0.1);
    border: 1px solid rgba(148, 163, 184, 0.15);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    margin-bottom: 1.25rem;
  }
  label {
    display: block;
    text-align: left;
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 0.35rem;
    letter-spacing: 0.03em;
  }
  input {
    width: 100%;
    padding: 0.85rem 1rem;
    border-radius: 0.85rem;
    border: 1px solid rgba(148, 163, 184, 0.25);
    background: rgba(15, 23, 42, 0.7);
    color: #e2e8f0;
    font-size: 1rem;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
    margin-bottom: 0.9rem;
    font-family: inherit;
  }
  input:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
  }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 3rem; }
  .pw-toggle {
    position: absolute;
    right: 0.6rem;
    top: 0.6rem;
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    font-size: 1.05rem;
    padding: 0.35rem 0.5rem;
    border-radius: 0.5rem;
  }
  .pw-toggle:hover { color: #e2e8f0; background: rgba(148,163,184,0.1); }

  .btn-row { display: flex; gap: 0.55rem; margin-top: 0.4rem; }
  button.btn {
    flex: 1;
    padding: 0.85rem 0.6rem;
    border-radius: 0.85rem;
    border: none;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s, opacity 0.2s;
    font-family: inherit;
  }
  .btn-join {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    box-shadow: 0 10px 20px -8px rgba(99, 102, 241, 0.6);
  }
  .btn-join:hover:not(:disabled) { transform: translateY(-2px); }
  .btn-hang {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.35);
  }
  .btn-mute {
    background: rgba(148, 163, 184, 0.12);
    color: #cbd5e1;
    border: 1px solid rgba(148, 163, 184, 0.25);
    flex: 0 0 56px;
    padding: 0.85rem 0;
    font-size: 1.1rem;
  }
  .btn-mute.muted {
    background: rgba(239, 68, 68, 0.2);
    color: #f87171;
    border-color: rgba(239, 68, 68, 0.45);
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  .status {
    margin-top: 1.25rem;
    padding: 0.9rem;
    border-radius: 0.9rem;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.12);
  }
  .status-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    font-size: 0.85rem;
    color: #cbd5e1;
    word-break: break-word;
    line-height: 1.35;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #64748b; flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.connecting { background: #f59e0b; animation: pulse 1.2s infinite; }
  .dot.connected  { background: #22c55e; animation: pulse 1.6s infinite; }
  .dot.error      { background: #ef4444; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
    70%  { box-shadow: 0 0 0 10px transparent; opacity: 0.9; }
    100% { box-shadow: 0 0 0 0 transparent; opacity: 1; }
  }
  .meter {
    margin-top: 0.8rem;
    height: 8px;
    background: rgba(148, 163, 184, 0.15);
    border-radius: 6px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
    transition: width 0.1s linear;
  }

  /* ---- User balls ---- */
  .users-title {
    margin-top: 1.25rem;
    font-size: 0.7rem;
    color: #94a3b8;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: left;
  }
  .users {
    margin-top: 0.75rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 0.75rem;
  }
  .user {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    animation: fadeIn 0.35s ease;
  }
  .ball {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.2rem;
    color: #0f172a;
    box-shadow: 0 10px 24px -8px rgba(0,0,0,0.6), inset 0 -6px 14px rgba(0,0,0,0.15);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .ball.talking {
    animation: talk 0.9s infinite ease-in-out;
    box-shadow: 0 0 0 0 currentColor;
  }
  @keyframes talk {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
    50%      { transform: scale(1.06); box-shadow: 0 0 0 10px rgba(34,197,94,0); }
  }
  .ball.muted {
    filter: grayscale(0.8) brightness(0.7);
  }
  .ball.muted::after {
    content: '🔇';
    position: absolute;
    bottom: -2px;
    right: -2px;
    background: #0f172a;
    border-radius: 50%;
    font-size: 0.85rem;
    padding: 3px 5px;
    border: 1px solid rgba(148,163,184,0.3);
  }
  .user-name {
    font-size: 0.72rem;
    color: #cbd5e1;
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .user-me .user-name { color: #93c5fd; font-weight: 600; }
  .user-btn {
    font-size: 0.65rem;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    border: 1px solid rgba(148,163,184,0.25);
    background: rgba(148,163,184,0.1);
    color: #cbd5e1;
    cursor: pointer;
    font-family: inherit;
  }
  .user-btn.muted {
    background: rgba(239,68,68,0.2);
    color: #f87171;
    border-color: rgba(239,68,68,0.45);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  .footer {
    margin-top: 1.2rem;
    font-size: 0.7rem;
    color: #64748b;
    line-height: 1.55;
  }
  .footer b { color: #94a3b8; }

  .joined-toast {
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.5);
    color: #86efac;
    padding: 0.55rem 1rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    z-index: 999;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
    backdrop-filter: blur(10px);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, -10px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translate(-50%, -10px); }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔒 Private Voice Room</h1>
    <p class="sub">Enter your name + password to join</p>
    <div class="lock-badge">🔐 P2P audio · auto-connect</div>

    <label for="name">Your name</label>
    <input id="name" type="text" placeholder="e.g. Mohamed" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="20" />

    <label for="password">Password</label>
    <div class="pw-wrap">
      <input id="password" type="password" placeholder="Shared password" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button id="pwToggle" class="pw-toggle" type="button" title="Show/hide">👁️</button>
    </div>

    <div class="btn-row">
      <button id="joinBtn" class="btn btn-join">Join room</button>
      <button id="muteBtn" class="btn btn-mute" disabled title="Mute my mic">🎤</button>
      <button id="hangBtn" class="btn btn-hang" disabled>Leave</button>
    </div>

    <div class="status">
      <div class="status-line">
        <span id="dot" class="dot"></span>
        <span id="statusText">Idle</span>
      </div>
      <div class="meter" title="Your mic level">
        <div id="meterFill" class="meter-fill"></div>
      </div>
    </div>

    <div class="users-title" id="usersTitle" style="display:none;">In the room</div>
    <div class="users" id="usersList"></div>

    <div class="footer">
      Everyone with the <b>same password</b> joins the same room.<br>
      Keep this tab open · allow microphone access.
    </div>
  </div>

  <script type="module">
    import { joinRoom } from 'https://cdn.skypack.dev/trystero';

    // ============ CONFIG ============
    const ROOM_PASSWORD = '1234566';   // <-- the required password
    const APP_ID        = 'private-voice-room-v1';
    // ================================

    // ---------- DOM ----------
    const nameInput   = document.getElementById('name');
    const pwInput     = document.getElementById('password');
    const pwToggle    = document.getElementById('pwToggle');
    const joinBtn     = document.getElementById('joinBtn');
    const muteBtn     = document.getElementById('muteBtn');
    const hangBtn     = document.getElementById('hangBtn');
    const dot         = document.getElementById('dot');
    const statusText  = document.getElementById('statusText');
    const meterFill   = document.getElementById('meterFill');
    const usersList   = document.getElementById('usersList');
    const usersTitle  = document.getElementById('usersTitle');

    // ---------- State ----------
    let room = null;
    let localStream = null;
    let audioCtx = null, analyser = null, meterRAF = null;
    let wakeLock = null;
    let isMuted = false;
    let myName = '';
    let myPeerId = null;

    // peerId -> { name, ballEl, btnEl, audioEl, muted, talkTimer, audioCtxRemote }
    const peers = new Map();

    // ---------- Helpers ----------
    const setStatus = (text, cls = '') => {
      statusText.textContent = text;
      dot.className = 'dot ' + cls;
    };

    const colorFor = (str) => {
      // Deterministic pastel color from a string
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
      const hue = hash % 360;
      return `hsl(${hue}, 70%, 68%)`;
    };

    const initialsOf = (name) => {
      const clean = (name || '?').trim();
      if (!clean) return '?';
      const parts = clean.split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    };

    const showToast = (msg) => {
      const t = document.createElement('div');
      t.className = 'joined-toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    };

    // ---------- Room name derived from password (so it's the same for everyone using correct password) ----------
    const deriveRoomName = async (password) => {
      const enc = new TextEncoder();
      const data = enc.encode('voice-room::' + password + '::v1');
      const buf = await crypto.subtle.digest('SHA-256', data);
      const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      return 'vr-' + hex.slice(0, 32);
    };

    // ---------- Mic meter ----------
    const startMeter = (stream) => {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        src.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);
        const tick = () => {
          if (!analyser) return;
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const avg = sum / data.length;
          meterFill.style.width = Math.min(100, (avg / 128) * 100) + '%';
          meterRAF = requestAnimationFrame(tick);
        };
        tick();
      } catch (e) { console.warn('Meter error', e); }
    };
    const stopMeter = () => {
      if (meterRAF) cancelAnimationFrame(meterRAF);
      meterRAF = null;
      meterFill.style.width = '0%';
      if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; }
      analyser = null;
    };

    // ---------- Mic ----------
    const getMic = async () => {
      if (localStream) return localStream;
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      });
      startMeter(localStream);
      return localStream;
    };

    // ---------- Wake Lock ----------
    const requestWakeLock = async () => {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) {}
    };
    const releaseWakeLock = () => {
      if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
    };

    // ---------- User ball rendering ----------
    const addUserBall = (peerId, name, isSelf = false) => {
      if (peers.has(peerId)) return;

      const wrap = document.createElement('div');
      wrap.className = 'user' + (isSelf ? ' user-me' : '');

      const ball = document.createElement('div');
      ball.className = 'ball';
      ball.style.background = `linear-gradient(135deg, ${colorFor(name + peerId)}, ${colorFor(peerId + name)})`;
      ball.textContent = initialsOf(name);

      const nameEl = document.createElement('div');
      nameEl.className = 'user-name';
      nameEl.textContent = isSelf ? `${name} (you)` : name;

      wrap.appendChild(ball);
      wrap.appendChild(nameEl);

      let btn = null;
      if (!isSelf) {
        btn = document.createElement('button');
        btn.className = 'user-btn';
        btn.textContent = '🔊 Hear';
        btn.addEventListener('click', () => togglePeerMute(peerId));
        wrap.appendChild(btn);
      }

      usersList.appendChild(wrap);
      usersTitle.style.display = 'block';

      peers.set(peerId, {
        name, isSelf,
        ballEl: ball,
        nameEl,
        btnEl: btn,
        audioEl: null,
        muted: false,
        remoteAnalyser: null,
        remoteCtx: null,
        raf: null,
        talking: false
      });
    };

    const removeUserBall = (peerId) => {
      const p = peers.get(peerId);
      if (!p) return;
      p.ballEl.parentElement?.remove();
      if (p.audioEl) { p.audioEl.srcObject = null; p.audioEl.remove(); }
      if (p.raf) cancelAnimationFrame(p.raf);
      if (p.remoteCtx) p.remoteCtx.close().catch(()=>{});
      peers.delete(peerId);
      if (peers.size === 0) usersTitle.style.display = 'none';
    };

    const togglePeerMute = (peerId) => {
      const p = peers.get(peerId);
      if (!p || !p.audioEl) return;
      p.muted = !p.muted;
      p.audioEl.muted = p.muted;
      p.ballEl.classList.toggle('muted', p.muted);
      if (p.btnEl) {
        p.btnEl.classList.toggle('muted', p.muted);
        p.btnEl.textContent = p.muted ? '🔇 Muted' : '🔊 Hear';
      }
    };

    // ---------- Remote audio + talking detection ----------
    const attachRemoteStream = (stream, peerId) => {
      const p = peers.get(peerId);
      if (!p) return;

      // Audio element
      let audio = p.audioEl;
      if (!audio) {
        audio = document.createElement('audio');
        audio.autoplay = true;
        audio.playsInline = true;
        audio.setAttribute('playsinline', '');
        document.body.appendChild(audio);
        p.audioEl = audio;
      }
      audio.srcObject = stream;
      audio.play().catch(err => console.warn('Play blocked:', err));

      // Talking detection via WebAudio
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaStreamSource(stream);
        const an = ctx.createAnalyser();
        an.fftSize = 512;
        src.connect(an);
        p.remoteCtx = ctx;
        p.remoteAnalyser = an;
        const data = new Uint8Array(an.frequencyBinCount);
        const tick = () => {
          if (!p.remoteAnalyser) return;
          p.remoteAnalyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const avg = sum / data.length;
          const talking = avg > 18;
          if (talking !== p.talking) {
            p.talking = talking;
            p.ballEl.classList.toggle('talking', talking);
          }
          p.raf = requestAnimationFrame(tick);
        };
        tick();
      } catch (e) { console.warn('Remote analyser error', e); }
    };

    // ---------- Cleanup ----------
    const cleanup = async () => {
      if (room) { try { await room.leave(); } catch(e){} room = null; }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      [...peers.keys()].forEach(removeUserBall);
      peers.clear();
      stopMeter();
      releaseWakeLock();
      isMuted = false;
      muteBtn.classList.remove('muted');
      muteBtn.textContent = '🎤';
      muteBtn.disabled = true;
      hangBtn.disabled = true;
      joinBtn.disabled = false;
      nameInput.disabled = false;
      pwInput.disabled = false;
      usersTitle.style.display = 'none';
      myPeerId = null;
    };

    // ---------- Join ----------
    const join = async () => {
      const name = nameInput.value.trim();
      const password = pwInput.value.trim();

      if (!name) { setStatus('Enter your name', 'error'); return; }
      if (!password) { setStatus('Enter the password', 'error'); return; }
      if (password !== ROOM_PASSWORD) {
        setStatus('❌ Wrong password', 'error');
        return;
      }
      if (!window.crypto?.subtle) {
        setStatus('Browser not supported — needs HTTPS', 'error');
        return;
      }

      myName = name;
      joinBtn.disabled = true;
      nameInput.disabled = true;
      pwInput.disabled = true;

      setStatus('Requesting microphone…', 'connecting');
      try { await getMic(); }
      catch (err) {
        setStatus('Microphone denied — please allow mic access', 'error');
        joinBtn.disabled = false;
        nameInput.disabled = false;
        pwInput.disabled = false;
        return;
      }

      setStatus('Connecting to room…', 'connecting');
      const roomName = await deriveRoomName(password);

      try {
        room = joinRoom({ appId: APP_ID }, roomName);
      } catch (e) {
        setStatus('Failed to join: ' + e.message, 'error');
        joinBtn.disabled = false;
        nameInput.disabled = false;
        pwInput.disabled = false;
        return;
      }

      myPeerId = room.selfId;
      addUserBall(myPeerId, myName, true);
      muteBtn.disabled = false;
      hangBtn.disabled = false;
      requestWakeLock();
      setStatus('Online · waiting for others…', 'connecting');

      // Broadcast my name (also acts as heartbeat)
      const [sendName] = room.makeAction('name');
      sendName({ name: myName });

      // When someone joins: send my name + my stream to them
      room.onPeerJoin(async (peerId) => {
        try { sendName({ name: myName }, peerId); } catch(e){}
        try { room.addStream(localStream, peerId); } catch(e){}
        // Temporary placeholder until their name arrives
        if (!peers.has(peerId)) {
          addUserBall(peerId, 'Guest');
          showToast('Someone joined');
        }
        const others = peers.size - 1; // minus me
        setStatus(`🔊 Connected · ${others} other(s)`, 'connected');
      });

      room.onPeerLeave((peerId) => {
        const p = peers.get(peerId);
        if (p) showToast(`${p.name} left`);
        removeUserBall(peerId);
        const others = peers.size - 1;
        if (others <= 0) setStatus('Alone in room · waiting…', 'connecting');
        else setStatus(`🔊 Connected · ${others} other(s)`, 'connected');
      });

      // Receive names
      room.onMessage('name', (data, peerId) => {
        const theirName = (data && data.name) ? data.name : 'Guest';
        const p = peers.get(peerId);
        if (p) {
          // Update existing placeholder ball
          p.name = theirName;
          p.nameEl.textContent = theirName;
          p.ballEl.textContent = initialsOf(theirName);
          p.ballEl.style.background = `linear-gradient(135deg, ${colorFor(theirName + peerId)}, ${colorFor(peerId + theirName)})`;
        } else {
          addUserBall(peerId, theirName);
        }
        showToast(`${theirName} joined 👋`);
      });

      // Receive audio streams
      room.onPeerStream((stream, peerId) => {
        const p = peers.get(peerId);
        if (!p) {
          // Stream arrived before name — make placeholder
          addUserBall(peerId, 'Guest');
        }
        attachRemoteStream(stream, peerId);
        const others = peers.size - 1;
        setStatus(`🔊 Connected · ${others} other(s)`, 'connected');
      });
    };

    // ---------- My mic mute ----------
    const toggleMyMute = () => {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (!track) return;
      isMuted = !isMuted;
      track.enabled = !isMuted;
      muteBtn.classList.toggle('muted', isMuted);
      muteBtn.textContent = isMuted ? '🔇' : '🎤';
      muteBtn.title = isMuted ? 'Unmute' : 'Mute my mic';
      const me = peers.get(myPeerId);
      if (me) me.ballEl.classList.toggle('muted', isMuted);
    };

    // ---------- Leave ----------
    const hangup = async () => {
      setStatus('Leaving room…', '');
      await cleanup();
      setStatus('Idle', '');
    };

    // ---------- Events ----------
    joinBtn.addEventListener('click', join);
    muteBtn.addEventListener('click', toggleMyMute);
    hangBtn.addEventListener('click', hangup);
    pwToggle.addEventListener('click', () => {
      pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
      pwToggle.textContent = pwInput.type === 'password' ? '👁️' : '🙈';
    });
    [nameInput, pwInput].forEach(el => el.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !joinBtn.disabled) join();
    }));

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && room) requestWakeLock();
    });

    window.addEventListener('beforeunload', () => { cleanup(); });
  </script>
</body>
</html>
